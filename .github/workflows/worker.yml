# One worker job on a fresh GitHub computer. A project repo calls this file.
# The project keeps its own setup, proof, and rules files in .factory/; this file holds the steps every project shares.
# With no issue, the job runs the project's proof only. With an issue, Claude works the issue and opens a PR.
name: Worker

on:
  workflow_call:
    inputs:
      setup:
        description: Project script that installs the app and its services
        type: string
        default: .factory/setup.sh
      proof:
        description: Project script that proves the app works
        type: string
        default: .factory/smoke.sh
      proof-path:
        description: Folder with the proof files to keep
        type: string
        default: .verification/evidence/
      rules:
        description: Project rules added to the worker prompt; issue runs need it
        type: string
        default: .factory/worker-rules.md
      # A string: workflow_dispatch passes its number input on as text.
      issue:
        description: Issue number to work; 0 runs the proof only
        type: string
        default: "0"
      branch:
        description: Open PR branch to bring up to date with main; empty starts new work from main
        type: string
        default: ""
      node-version:
        type: string
        default: "24"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # Pushes and PRs made with the built-in GITHUB_TOKEN start no checks, so issue runs need this token.
      FACTORY_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ inputs.issue != '0' && secrets.FACTORY_GITHUB_TOKEN || github.token }}
          persist-credentials: ${{ inputs.issue != '0' }}
          # Merging main into an open PR branch needs the shared history.
          fetch-depth: ${{ inputs.branch == '' && 1 || 0 }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      # Outside the project checkout, so a worker cannot commit factory files by mistake.
      - name: Get factory files
        run: git clone --quiet --depth 1 https://github.com/Jahazel/software-factory "$RUNNER_TEMP/factory"

      - name: Install pstack and skills
        run: bash "$RUNNER_TEMP/factory/scripts/install-claude.sh"

      # No API key fallback: when the subscription sign-in fails, the worker stops here.
      - name: Check Claude sign-in
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "Reply with the single word OK." --model haiku --max-turns 1

      - name: Check Claude sees pstack and skills
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          names=$(claude -p "List the names of every skill available to you, one per line, nothing else." --model haiku --max-turns 1)
          echo "$names"
          for skill in pstack:poteto-mode architect tdd code-review impeccable principle-prove-it-works; do
            grep -q "$skill" <<<"$names" || { echo "Claude does not see the skill $skill."; exit 1; }
          done

      # Claude Code removes CLAUDE_CODE_OAUTH_TOKEN from the commands it runs, so a claude -p
      # started inside the worker (code-review does this) is signed out. A wrapper ahead of the
      # real claude on PATH reads the token from a file only this user can read.
      - name: Sign in nested Claude runs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          real=$(command -v claude)
          umask 077
          printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" > "$HOME/.claude/factory-token"
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/claude" <<WRAPPER
          #!/usr/bin/env bash
          export CLAUDE_CODE_OAUTH_TOKEN="\${CLAUDE_CODE_OAUTH_TOKEN:-\$(cat "$HOME/.claude/factory-token")}"
          exec "$real" "\$@"
          WRAPPER
          chmod 700 "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check nested Claude sign-in
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          out=$(claude -p --model haiku --max-turns 3 --dangerously-skip-permissions <<'PROMPT'
          Run this exact shell command once, then reply with its full output, verbatim, and nothing else:
          claude -p 'Reply with the single word OK.' --model haiku --max-turns 1
          PROMPT
          )
          echo "$out"
          grep -qx "OK" <<<"$out" && ! grep -q "Not logged in" <<<"$out" || { echo "A claude -p inside the worker cannot sign in."; exit 1; }

      - name: Project setup
        run: bash "${{ inputs.setup }}"

      - name: Project proof
        if: inputs.issue == '0'
        run: bash "${{ inputs.proof }}"

      - name: Prepare the issue
        id: prepare
        if: inputs.issue != '0'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Issue runs need the FACTORY_GITHUB_TOKEN secret."; exit 1; }
          test -f "${{ inputs.rules }}" || { echo "Issue runs need the project rules file (the rules input)."; exit 1; }
          git config user.name "software-factory worker"
          git config user.email "72827154+Jahazel@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/worker"
          branch=$(bash "$RUNNER_TEMP/factory/scripts/prepare-issue.sh" "${{ inputs.issue }}" "$RUNNER_TEMP/worker/issue.md" "${{ inputs.branch }}")
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Work the issue
        if: inputs.issue != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          PROMPT: ${{ inputs.branch == '' && 'worker.md' || 'resolve.md' }}
        run: |
          dir="$RUNNER_TEMP/worker"
          prompts="$RUNNER_TEMP/factory/prompts"
          sed -e "/{{MERGE_MAIN}}/{r $prompts/merge-main.md" -e "d;}" \
              -e "s|{{ISSUE}}|$ISSUE|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
              -e "s|{{BRANCH}}|$BRANCH|g" -e "s|{{ISSUE_FILE}}|$dir/issue.md|g" \
              "$prompts/$PROMPT" > "$dir/prompt.md"
          { echo; echo "## Project rules"; echo; cat "${{ inputs.rules }}"; } >> "$dir/prompt.md"
          claude -p --model claude-opus-5-5 --effort medium --dangerously-skip-permissions \
            --output-format stream-json --verbose < "$dir/prompt.md" \
            | tee "$dir/transcript.jsonl" \
            | jq -r --unbuffered 'select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text'

      - name: Keep proof files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ github.run_id }}
          path: |
            ${{ inputs.proof-path }}
            ${{ runner.temp }}/worker/
          retention-days: 7
          if-no-files-found: warn
