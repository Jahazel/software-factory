# Merges main into the open factory PRs, decides which PRs need a resolve worker and which labeled
# issues get a worker, runs one worker per claimed job, and always releases the claims. A project repo calls this file when the owner
# adds a label and when main moves.
name: Orchestrator

on:
  workflow_call:
    inputs:
      trigger-label:
        description: The label that starts a worker; agent:implement while the owner starts each run, ready-for-agent once triage alone starts runs
        type: string
        required: true
      cap:
        description: Largest number of workers at the same time
        type: number
        default: 1
      dry-run:
        description: Report the decisions only; change no labels and start no worker
        type: boolean
        default: true
      agent-conflicts:
        description: Path prefixes, space-separated, where a merge conflict goes to a worker; any other conflict blocks the PR
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      FACTORY_GITHUB_TOKEN:
        required: true

# Label changes and the re-run use github.token, so they start no workflow by accident.
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One decide at a time per project, so two label events cannot both take the last free place.
    # Only this job holds the lock; workers run outside it.
    concurrency:
      group: factory-orchestrator-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      jobs: ${{ steps.decide.outputs.jobs }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      # No API key fallback: when the subscription sign-in fails, the orchestrator stops and changes no labels.
      - name: Check Claude sign-in
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "Reply with the single word OK." --model haiku --max-turns 1

      - name: Get factory files
        run: git clone --quiet --depth 1 https://github.com/Jahazel/software-factory "$RUNNER_TEMP/factory"

      - name: Refresh PRs, plan, and claim
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # Only the merge of main into a PR uses it, so that push starts the PR's checks.
          FACTORY_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TRIGGER_LABEL: ${{ inputs.trigger-label }}
          CAP: ${{ inputs.cap }}
          DRY_RUN: ${{ inputs.dry-run }}
          AGENT_CONFLICTS: ${{ inputs.agent-conflicts }}
        run: bash "$RUNNER_TEMP/factory/scripts/orchestrate.sh"

  work:
    needs: decide
    if: needs.decide.outputs.jobs != '[]' && needs.decide.outputs.jobs != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.jobs) }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    uses: Jahazel/software-factory/.github/workflows/worker.yml@main
    with:
      issue: ${{ format('{0}', matrix.issue) }}
      branch: ${{ matrix.branch }}
    secrets: inherit

  # A separate computer, so a claim is released even when a worker computer dies.
  settle:
    needs: [decide, work]
    if: always() && needs.decide.outputs.jobs != '[]' && needs.decide.outputs.jobs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get factory files
        run: git clone --quiet --depth 1 https://github.com/Jahazel/software-factory "$RUNNER_TEMP/factory"

      - name: Release claims and look again
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: ${{ needs.decide.outputs.jobs }}
          AGENT_CONFLICTS: ${{ inputs.agent-conflicts }}
        run: bash "$RUNNER_TEMP/factory/scripts/settle.sh"
